note: >-
  Drivezy published no client SDK for its own API — no public developer program or
  API reference was ever found (see x-coverage in apis.yml). What it did publish is a
  set of first-party OPEN SOURCE building blocks used to build its own platform:
  six Laravel/PHP packages under the `drivezy` Packagist vendor namespace (which maps
  1:1 to repositories in the github.com/drivezy organization) and seven JavaScript /
  React Native utility packages on npm. These are internal framework libraries, not
  API client libraries, so no `SDKs` pointer is emitted for them. Every entry below
  carries the version + publish date read from the registry metadata endpoint on
  2026-08-12; the newest release across the whole set is 2021-02-09, and the company's
  primary domain (drivezy.com) no longer resolves.
  ROUND 2 (2026-08-12): npm `storage-utility` was added. It was missed by a
  text=drivezy registry search because the Drivezy name appears nowhere in the package
  name — it was found by walking the github.com/drivezy repository list instead, and
  its npm `homepage`/`repository` metadata resolves to github.com/drivezy/storage-utility,
  which is the strongest first-party attestation of any npm entry here. It is also the
  newest npm release in the set (2020-09-25), superseding the previously-recorded
  2020-04-25. `drivezy-web-utils1` was added as an explicit row rather than being
  silently excluded as a duplicate scaffold: an unrecorded exclusion is indistinguishable
  from an unchecked package.
