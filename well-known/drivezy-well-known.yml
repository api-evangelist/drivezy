domain_history:
  note: >-
    WHY THIS MATTERS FOR RE-RUNS: drivezy.com left the company's control before it went
    dark, and for the last stretch of its life it served content that has nothing to do
    with vehicle rental. Any future automated pass that finds drivezy.com resolving again
    must NOT treat whatever answers as Drivezy. This timeline is the guard against that.
  source: http://web.archive.org/cdx/search/cdx?url=drivezy.com — <title> read from the
    raw archived body at each sampled timestamp
  timeline:
  - period: 2012-02-19 → 2024-06
    identity: Drivezy (the company)
    evidence: 'title: "Drivezy | Self-Drive Car, Bike & Scooter Rentals", later "Self
      Drive Car Rentals in India | Drivezy"'
  - period: 2025-01 → 2025-11
    identity: bare WordPress shell
    evidence: 'title: "DRIVEZY" on a stock WordPress 6.7.1 install with no rental
      product — the operating site was already gone'
  - period: 2025-12-11 → 2026-05-11
    identity: unrelated third party — Indonesian online-gambling SEO spam
    evidence: 'title: "MULTIBET88: Link Game Online yang Sering Bikin Member Auto WD",
      Yoast SEO v25.4; one 2026-01-22 capture shows a "One moment, please..." interstitial'
  - period: 2026-05-11 → present
