dns:
  domain: drivezy.com
  ns: []
  a: []
  answer: 'SERVFAIL (dig drivezy.com A) — authoritative nameservers answer REFUSED'
  delegation_present: true
  delegated_to:
  - dina.ns.cloudflare.com
  - jeremy.ns.cloudflare.com
  authoritative_probe:
    query: dig @dina.ns.cloudflare.com drivezy.com A
    rcode: REFUSED
    interpretation: >-
      The nameservers are still named in the registry delegation but no longer host the
      zone, which is what a Cloudflare zone deleted from its account looks like from the
      outside. Recursive resolvers convert REFUSED-from-every-authority into SERVFAIL.
  dnssec:
    ds_at_parent: none
    query: dig drivezy.com DS
    rcode: NOERROR
    note: The parent (.com) answers normally and publishes no DS record — the zone is
      not signed. The failure is entirely at the child's authorities.
  records_unobtainable:
    reason: zone unresolvable
    types: [A, AAAA, NS, MX, TXT, CAA, SOA]
    spf: unobtainable
    dmarc: unobtainable (_dmarc.drivezy.com also SERVFAIL)
    tls: >-
      no connection possible — openssl s_client to drivezy.com:443 fails at hostname
      resolution, so there is no certificate, no HSTS header and no protocol version to
      record.
