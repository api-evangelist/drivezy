method: probed
source: live HTTP + DNS probes of every Drivezy host on record
note: >-
  RECORDED ABSENCE, NOT A SURFACE. No `WellKnown` or `SecurityTxt` pointer is emitted
  from this file, because nothing returned a document. Every probe below failed at DNS
  resolution, not at HTTP, so there is no host of the company's own left to serve a
  /.well-known/ surface.
  ROUND 2 (2026-08-12) sharpened two things the first pass got approximately right and
  literally wrong. (1) The DNS diagnosis: delegation has NOT been removed. The registry
  still delegates drivezy.com to DINA/JEREMY.NS.CLOUDFLARE.COM, but those nameservers
  answer REFUSED — the zone has been dropped from the Cloudflare account behind them —
  and recursive resolvers surface that as SERVFAIL. That is a different failure from
  NXDOMAIN and worth stating precisely, because a REFUSED-at-authority domain can be
  brought back by whoever holds the account, whereas the name itself is not expired
  until 2027-04-20. (2) The "last captured 2025-10-19" claim was wrong and is corrected
  in domain_history below: the Wayback record runs to 2026-05-11, but what was captured
  in the final eighteen months is NOT Drivezy.
