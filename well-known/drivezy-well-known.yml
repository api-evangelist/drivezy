archived_well_known_probe:
  note: >-
    Because the live host is gone, the Wayback CDX index was queried for any
    /.well-known/ path ever captured on drivezy.com, so an absence today is not mistaken
    for an absence always. Four paths are indexed with statuscode 200 — and ALL FOUR ARE
    SOFT-404s. Each archived body was fetched and every one is the same HTML error page
    whose <title> is "404 Not Found". This is the exact false-credit pattern the pipeline
    warns about: a CDX status column, or any probe that trusts the status line without
    reading the body, would have credited Drivezy with a served security.txt and a served
    OpenID discovery document. It served neither, ever. 200 is not evidence.
  source: http://web.archive.org/cdx/search/cdx?url=drivezy.com&matchType=domain
  paths_indexed:
  - path: /.well-known/security.txt
    cdx_status: 200
    body_verdict: soft-404 (HTML error page, title "404 Not Found")
    document: false
  - path: /.well-known/openid-configuration
