aid: drivezy
name: Drivezy
description: 'Drivezy — founded in Bengaluru, India in 2015 and originally launched
  as JustRide — operated a peer-to-peer vehicle-sharing and self-drive rental
  marketplace covering cars, motorcycles and scooters, pairing a company-operated
  fleet with vehicles listed by individual owners. It raised venture funding through
  a Series B and held acquisition talks with Yamaha. Drivezy never ran a public
  developer program: no portal, no API reference and no machine-readable contract
  were ever published. The /api/* endpoints visible in archived captures of
  secure.drivezy.com were the private backend of its consumer mobile app. As of
  2026-08-12 drivezy.com does not resolve: the registry still delegates it to
  Cloudflare nameservers, but those nameservers answer REFUSED, so every lookup
  returns SERVFAIL. The domain had already left the company before it went dark —
  Internet Archive captures show the real site through mid-2024, a bare WordPress
  shell through 2025, and unrelated Indonesian gambling SEO spam from December 2025
  until the final capture on 2026-05-11 — so a drivezy.com that resolves again
  should not be read as this company without fresh evidence. What remains public is
  the github.com/drivezy organization and thirteen packages on Packagist and npm —
  internal Laravel and JavaScript platform libraries, not API client SDKs.'
